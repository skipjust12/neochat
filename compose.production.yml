services:
  postgres:
    image: postgres:16-alpine
    container_name: neochat-postgres
    restart: unless-stopped
    mem_limit: 300m
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=20", "-c", "effective_cache_size=128MB"]
    networks: [backend]
    volumes:
      - neochat_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: neochat-redis
    restart: unless-stopped
    mem_limit: 200m
    command: >
      redis-server --maxmemory 150mb --maxmemory-policy noeviction
      --requirepass ${REDIS_PASSWORD} --appendonly yes --appendfsync always --save 60 1
    networks: [backend]
    volumes:
      - neochat_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: neochat-server
    restart: unless-stopped
    # Docker's default is 10s before SIGKILL, shorter than cmd/server's own
    # 25s graceful-shutdown grace period (see main.go) -- without this, a
    # `docker stop`/`docker compose down` could SIGKILL an in-flight
    # /chat/stream generation before the server ever gets to finish
    # draining it.
    stop_grace_period: 30s
    env_file:
      - .env
    environment:
      # Override the .env host defaults (127.0.0.1) -- inside the compose
      # network the databases are reachable by service name, not localhost.
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      REQUIRE_HTTPS: "true"
      TRUSTED_PROXY_CIDRS: "172.30.77.2/32"
    networks:
      backend:
      frontend:
        ipv4_address: 172.30.77.3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      NEOCHAT_DOMAIN: ${NEOCHAT_DOMAIN:?Set NEOCHAT_DOMAIN to your public DNS hostname}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      frontend:
        ipv4_address: 172.30.77.2
    depends_on:
      - server

networks:
  backend:
    internal: true
  frontend:
    ipam:
      config:
        - subnet: 172.30.77.0/24

volumes:
  caddy_data:
  caddy_config:
  neochat_pg_data:
  neochat_redis_data:

