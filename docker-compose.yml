services:
  postgres:
    image: postgres:16-alpine
    container_name: neochat-postgres
    restart: unless-stopped
    mem_limit: 300m
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=20", "-c", "effective_cache_size=128MB"]
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - neochat_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: neochat-redis
    restart: unless-stopped
    mem_limit: 200m
    command: >
      redis-server --maxmemory 150mb --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD} --save 60 1
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - neochat_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: neochat-server
    restart: unless-stopped
    # Docker's default is 10s before SIGKILL, shorter than cmd/server's own
    # 25s graceful-shutdown grace period (see main.go) -- without this, a
    # `docker stop`/`docker compose down` could SIGKILL an in-flight
    # /chat/stream generation before the server ever gets to finish
    # draining it.
    stop_grace_period: 30s
    env_file:
      - .env
    environment:
      # Override the .env host defaults (127.0.0.1) -- inside the compose
      # network the databases are reachable by service name, not localhost.
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  neochat_pg_data:
  neochat_redis_data:
